<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - FitLife</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='perfil.css') }}">
</head>
<body>

    <div class="container">
        <h1>Editar Perfil</h1>
        <p class="subtitulo">Atualize seus dados pessoais.</p>

        {% if mensagem %}
            <p class="mensagem">{{ mensagem }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('perfil') }}">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" value="{{ usuario.nome }}" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>

            <hr>

            <h2>Alterar senha</h2>
            <p class="ajuda">Deixe os campos de senha vazios se não quiser alterá-la.</p>

            <label for="senha_atual">Senha atual</label>
            <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password">

            <label for="nova_senha">Nova senha</label>
            <input type="password" id="nova_senha" name="nova_senha" minlength="6" autocomplete="new-password">

            <label for="confirmar_senha">Confirmar nova senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="6" autocomplete="new-password">

            <button type="submit">Salvar alterações</button>
        </form>

        <a class="voltar" href="{{ url_for('home') }}">
            Voltar para a Home
        </a>
    </div>

</body>
</html>
